# Render Blueprint — មានតែ `session_web` (stateless) ប៉ុណ្ណោះដែល deploy ទីនេះ។
#
# ⚠️ កុំបន្ថែម Bot (`main.py`) ជា service លើ plan free: Render គ្មាន persistent disk
#    ទើប `data/app.db` · `media/` · `backups/` នឹងត្រូវសាងសង់ឡើងវិញពីសូន្យ គ្រប់ deploy/restart។
#    Bot ត្រូវរត់លើ VPS (host ដែលមាន disk) — README ៤.២ ពន្យល់លម្អិត។
#
# ប្រើ៖
#   ក. Render → New → Blueprint → ជ្រើស repo នេះ (Render អាន `render.yaml` នៅ **root**)
#   ខ. ឬ New → Web Service + Root Directory = `session_web` (Render អាន `session_web/render.yaml`)
services:
  - type: web
    name: bot-auto-sell-make-session
    runtime: python
    region: singapore
    plan: free
    rootDir: session_web
    buildCommand: pip install -r requirements.txt
    # `$PORT` របស់ Render ជា 10000 — បើ bind 5050 នោះ deploy ជោគជ័យ ប៉ុន្តែ site ឱ្យតែ 404/502
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SESSION_WEB_SECRET
        sync: false # ← ដាក់ Fernet key ក្នុង Render Dashboard (Env Variables) មិន commit តម្លៃទេ
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SESSION_WEB_TTL
        value: "600"
      # Render ឱ្យ 120s (Vercel 60s) ទើប timeout ពេលចូល Telegram តាំងខ្ពស់ជាងបាន
      - key: SESSION_WEB_TIMEOUT
        value: "45"
